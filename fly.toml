# fly.toml — `fly launch --copy-config --name scorebug` then `fly redis create` and
# `fly secrets set REDIS_URL=<url>`. One small machine is plenty: every viewer of a
# game shares one ESPN round per cycle.
app = "scorebug"
primary_region = "atl"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
